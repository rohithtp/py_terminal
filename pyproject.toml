[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-terminal"
version = "0.1.0"
description = "An interactive terminal UI for safe command execution and LLM-assisted preflight checks."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["terminal", "cli", "rich", "LLM", "safety", "preflight"]
authors = [
  { name = "py_terminal" }
]
license = { file = "LICENSE" }
dependencies = [
  "rich>=15.0.0",
  "litellm==1.93.0",
  "openai==2.41.0",
]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
"py-terminal" = "terminal_web.main:main"

[tool.setuptools]
packages = { find = {} }
py-modules = ["safety_net"]
